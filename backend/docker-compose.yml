services:
  postgres:
    image: postgres:16-alpine
    container_name: logiforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: logiforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - logiforge_pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: logiforge-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/logiforge
      JWT_SECRET: local_docker_secret_change_me
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"

volumes:
  logiforge_pgdata: